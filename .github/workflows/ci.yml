name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Penghou.Nuwa.slnx --configuration Release

      - name: Test and coverage (core)
        run: >
          dotnet test tests/Penghou.Nuwa.Tests/Penghou.Nuwa.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=75
          /p:ThresholdType=line

      - name: Test and coverage (Extensions.AI)
        run: >
          dotnet test tests/Penghou.Nuwa.Extensions.AI.Tests/Penghou.Nuwa.Extensions.AI.Tests.csproj
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-ai/
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=75
          /p:ThresholdType=line

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-ai/
          if-no-files-found: error
